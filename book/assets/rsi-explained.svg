<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="20" fill="#101827"/><g font-family="Arial,sans-serif" fill="#eef2ff"><text x="40" y="48" font-size="28" font-weight="700">RSI: a momentum gauge</text><text x="40" y="80" font-size="17" fill="#cbd5e1">Relative Strength Index moves between 0 and 100.</text><line x1="70" y1="150" x2="930" y2="150" stroke="#f87171" stroke-width="2" stroke-dasharray="8 7"/><line x1="70" y1="420" x2="930" y2="420" stroke="#4ade80" stroke-width="2" stroke-dasharray="8 7"/><text x="80" y="143" font-size="18" fill="#fca5a5">70: often called overbought</text><text x="80" y="445" font-size="18" fill="#86efac">30: often called oversold</text><polyline points="80,360 140,320 200,350 260,235 320,170 380,280 440,345 500,250 560,135 620,205 680,300 740,180 800,250 860,380 920,335" fill="none" stroke="#c084fc" stroke-width="5"/><text x="745" y="190" font-size="18" fill="#c084fc">RSI line</text><line x1="70" y1="285" x2="930" y2="285" stroke="#64748b" stroke-width="2"/><text x="40" y="495" font-size="17" fill="#cbd5e1">RSI can stay high in a strong uptrend or low in a strong downtrend.</text></g></svg>
