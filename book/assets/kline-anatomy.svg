<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" fill="#101827" rx="18"/><g font-family="Arial,sans-serif" fill="#eef2ff"><text x="40" y="52" font-size="28" font-weight="700">K-line anatomy (one time interval)</text><line x1="280" y1="75" x2="280" y2="345" stroke="#fbbf24" stroke-width="8"/><rect x="235" y="145" width="90" height="125" fill="#22c55e" rx="4"/><line x1="235" y1="145" x2="325" y2="145" stroke="#86efac" stroke-width="3"/><line x1="235" y1="270" x2="325" y2="270" stroke="#86efac" stroke-width="3"/><g stroke="#93c5fd" stroke-width="2" fill="none"><path d="M285 78H470"/><path d="M325 145H530"/><path d="M325 270H530"/><path d="M285 345H470"/></g><g font-size="22"><text x="480" y="85">High — top of upper wick</text><text x="540" y="153">Close (green candle)</text><text x="540" y="278">Open (green candle)</text><text x="480" y="353">Low — bottom of lower wick</text></g><text x="40" y="395" font-size="19" fill="#cbd5e1">Body = open-to-close · Wicks = extremes · Color is a convention, not a signal</text></g></svg>
