<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" fill="#101827" rx="18"/><g font-family="Arial,sans-serif"><text x="40" y="48" fill="#eef2ff" font-size="27" font-weight="700">Swing structure</text><polyline points="80,320 190,240 290,275 410,160 510,205 640,95 780,140" fill="none" stroke="#4ade80" stroke-width="6"/><g fill="#fbbf24" font-size="21"><text x="170" y="225">HH</text><text x="274" y="305">HL</text><text x="392" y="145">HH</text><text x="493" y="235">HL</text><text x="625" y="80">HH</text></g><line x1="80" y1="350" x2="800" y2="350" stroke="#334155"/><text x="80" y="385" fill="#cbd5e1" font-size="19">Higher high + higher low = possible uptrend sequence</text><polyline points="80,115 190,180 290,140 410,250 510,215 640,330 780,275" fill="none" stroke="#fb7185" stroke-width="6" opacity=".85"/><g fill="#fda4af" font-size="21"><text x="170" y="205">LH</text><text x="274" y="125">LH</text><text x="392" y="275">LL</text><text x="493" y="200">LH</text><text x="625" y="355">LL</text></g><text x="80" y="105" fill="#fda4af" font-size="19">Lower high + lower low = possible downtrend sequence</text></g></svg>
