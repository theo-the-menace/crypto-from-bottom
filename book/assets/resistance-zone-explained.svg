<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How resistance works</title>
  <desc id="desc">A detailed diagram showing repeated rejections near a resistance zone, the difference between a wick and a candle close, a false breakout, a confirmed breakout, and a retest that turns resistance into support.</desc>
  <rect width="1200" height="760" fill="#17202b"/>
  <text x="55" y="48" fill="#e8edf3" font-family="Arial, sans-serif" font-size="30" font-weight="700">What a resistance zone tells us</text>
  <text x="55" y="78" fill="#aab7c6" font-family="Arial, sans-serif" font-size="17">Resistance is an area where selling has repeatedly slowed or rejected an advance.</text>

  <!-- Main chart -->
  <rect x="55" y="105" width="1090" height="370" rx="10" fill="#1d2936" stroke="#314052" stroke-width="2"/>
  <g stroke="#314052" stroke-width="1">
    <line x1="80" y1="160" x2="1120" y2="160"/><line x1="80" y1="220" x2="1120" y2="220"/>
    <line x1="80" y1="280" x2="1120" y2="280"/><line x1="80" y1="340" x2="1120" y2="340"/>
    <line x1="80" y1="400" x2="1120" y2="400"/>
  </g>
  <!-- Resistance zone -->
  <rect x="80" y="190" width="1040" height="42" fill="#f2b84b" opacity="0.18"/>
  <line x1="80" y1="190" x2="1120" y2="190" stroke="#f2b84b" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="80" y1="232" x2="1120" y2="232" stroke="#f2b84b" stroke-width="3" stroke-dasharray="9 7"/>
  <rect x="95" y="137" width="225" height="31" rx="6" fill="#263547"/>
  <text x="108" y="159" fill="#f2b84b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Resistance zone</text>

  <!-- Range candles: repeated tests -->
  <g stroke-width="4">
    <g stroke="#38c79a" fill="#38c79a"><line x1="145" y1="410" x2="145" y2="300"/><rect x="134" y="350" width="22" height="45"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="205" y1="315" x2="205" y2="225"/><rect x="194" y="245" width="22" height="48"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="265" y1="340" x2="265" y2="198"/><rect x="254" y="255" width="22" height="55"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="325" y1="210" x2="325" y2="315"/><rect x="314" y="235" width="22" height="55"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="385" y1="350" x2="385" y2="195"/><rect x="374" y="250" width="22" height="58"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="445" y1="200" x2="445" y2="330"/><rect x="434" y="230" width="22" height="60"/></g>
    <!-- Wick rejection: trades above zone but closes back inside -->
    <g stroke="#ef5364" fill="#ef5364"><line x1="505" y1="140" x2="505" y2="275"/><rect x="494" y="205" width="22" height="42"/></g>
  </g>
  <g fill="#1d2936" opacity="0.94">
    <rect x="575" y="106" width="345" height="27" rx="5"/>
    <rect x="665" y="82" width="330" height="27" rx="5"/>
    <rect x="805" y="300" width="270" height="27" rx="5"/>
    <rect x="995" y="20" width="140" height="27" rx="5"/>
  </g>
  <path d="M505 140 L505 112 L575 112" fill="none" stroke="#ef5364" stroke-width="2"/>
  <text x="585" y="118" fill="#ef5364" font-family="Arial, sans-serif" font-size="17" font-weight="700">Wick above, close back inside = weak break</text>

  <!-- Confirmed breakout -->
  <g stroke="#38c79a" fill="#38c79a" stroke-width="4">
    <line x1="585" y1="270" x2="585" y2="105"/><rect x="573" y="125" width="24" height="118"/>
  </g>
  <path d="M585 125 L585 92 L665 92" fill="none" stroke="#38c79a" stroke-width="2"/>
  <text x="675" y="98" fill="#38c79a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Close above zone = possible breakout</text>

  <!-- Retest candles -->
  <g stroke-width="4">
    <g stroke="#ef5364" fill="#ef5364"><line x1="655" y1="120" x2="655" y2="270"/><rect x="644" y="165" width="22" height="55"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="720" y1="270" x2="720" y2="135"/><rect x="709" y="180" width="22" height="55"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="785" y1="205" x2="785" y2="95"/><rect x="774" y="130" width="22" height="55"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="850" y1="120" x2="850" y2="205"/><rect x="839" y="140" width="22" height="40"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="915" y1="175" x2="915" y2="60"/><rect x="904" y="90" width="22" height="68"/></g>
  </g>
  <path d="M720 270 L720 315 L805 315" fill="none" stroke="#f2b84b" stroke-width="2"/>
  <text x="815" y="321" fill="#f2b84b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Pullback tests the old zone</text>
  <path d="M915 60 L915 35 L1000 35" fill="none" stroke="#38c79a" stroke-width="2"/>
  <text x="1010" y="41" fill="#38c79a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Continuation</text>

  <!-- Bottom explanation cards -->
  <g font-family="Arial, sans-serif">
    <rect x="55" y="510" width="350" height="205" rx="10" fill="#202d3b" stroke="#314052" stroke-width="2"/>
    <rect x="425" y="510" width="350" height="205" rx="10" fill="#202d3b" stroke="#314052" stroke-width="2"/>
    <rect x="795" y="510" width="350" height="205" rx="10" fill="#202d3b" stroke="#314052" stroke-width="2"/>
    <text x="78" y="548" fill="#f2b84b" font-size="21" font-weight="700">1. Why it forms</text>
    <text x="78" y="580" fill="#e8edf3" font-size="17">Traders who bought lower</text>
    <text x="78" y="606" fill="#e8edf3" font-size="17">may sell near an old high.</text>
    <text x="78" y="632" fill="#e8edf3" font-size="17">New buyers may hesitate there.</text>
    <text x="78" y="672" fill="#aab7c6" font-size="16">Repeated reactions make the</text>
    <text x="78" y="695" fill="#aab7c6" font-size="16">area visible to more traders.</text>

    <text x="448" y="548" fill="#38c79a" font-size="21" font-weight="700">2. What confirms a break</text>
    <text x="448" y="580" fill="#e8edf3" font-size="17">A candle closes above the zone,</text>
    <text x="448" y="606" fill="#e8edf3" font-size="17">participation is meaningful, and</text>
    <text x="448" y="632" fill="#e8edf3" font-size="17">a later pullback holds above it.</text>
    <text x="448" y="672" fill="#aab7c6" font-size="16">One wick is evidence of a test,</text>
    <text x="448" y="695" fill="#aab7c6" font-size="16">not proof of a new trend.</text>

    <text x="818" y="548" fill="#ef5364" font-size="21" font-weight="700">3. When it fails</text>
    <text x="818" y="580" fill="#e8edf3" font-size="17">Price closes back inside the range,</text>
    <text x="818" y="606" fill="#e8edf3" font-size="17">the retest breaks below the zone,</text>
    <text x="818" y="632" fill="#e8edf3" font-size="17">or the larger trend disagrees.</text>
    <text x="818" y="672" fill="#aab7c6" font-size="16">Treat the setup as invalid and</text>
    <text x="818" y="695" fill="#aab7c6" font-size="16">reassess; do not chase the move.</text>
  </g>
</svg>
