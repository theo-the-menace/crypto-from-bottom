<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="20" fill="#101827"/><g font-family="Arial,sans-serif" fill="#eef2ff"><text x="40" y="48" font-size="28" font-weight="700">MACD: trend momentum and crossings</text><text x="40" y="80" font-size="17" fill="#cbd5e1">MACD compares two moving averages and adds a signal line.</text><line x1="70" y1="300" x2="930" y2="300" stroke="#64748b" stroke-width="2"/><g fill="#475569"><rect x="100" y="260" width="24" height="40"/><rect x="150" y="220" width="24" height="80"/><rect x="200" y="275" width="24" height="25"/><rect x="250" y="300" width="24" height="45"/><rect x="300" y="300" width="24" height="85"/><rect x="350" y="300" width="24" height="55"/><rect x="400" y="250" width="24" height="50"/><rect x="450" y="190" width="24" height="110"/><rect x="500" y="160" width="24" height="140"/><rect x="550" y="230" width="24" height="70"/><rect x="600" y="275" width="24" height="25"/><rect x="650" y="300" width="24" height="60"/><rect x="700" y="300" width="24" height="100"/><rect x="750" y="300" width="24" height="55"/><rect x="800" y="260" width="24" height="40"/></g><polyline points="80,245 140,220 200,260 260,325 320,390 380,350 440,230 500,170 560,215 620,285 680,350 740,370 800,300 860,245 920,260" fill="none" stroke="#fbbf24" stroke-width="5"/><polyline points="80,260 140,235 200,250 260,305 320,360 380,355 440,270 500,205 560,220 620,270 680,330 740,355 800,325 860,270 920,255" fill="none" stroke="#38bdf8" stroke-width="5"/><text x="725" y="130" font-size="18" fill="#fbbf24">MACD line</text><text x="725" y="155" font-size="18" fill="#38bdf8">Signal line</text><text x="40" y="470" font-size="17" fill="#cbd5e1">Crosses can show momentum shifts, but they lag and can whipsaw in a range.</text></g></svg>
