<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">A key level: previous highs, breakout, retest, and continuation</title>
  <desc id="desc">A simplified candlestick diagram. Several previous highs create a resistance zone. A large green candle closes above it. Price then tests the old zone, holds above it, and makes a higher low and a higher high.</desc>
  <rect width="1000" height="500" fill="#17202b"/>
  <g stroke="#314052" stroke-width="1">
    <line x1="70" y1="80" x2="940" y2="80"/><line x1="70" y1="160" x2="940" y2="160"/>
    <line x1="70" y1="240" x2="940" y2="240"/><line x1="70" y1="320" x2="940" y2="320"/><line x1="70" y1="400" x2="940" y2="400"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#e8edf3">
    <text x="70" y="42" font-size="24" font-weight="700">A key level: previous highs → breakout → retest</text>
    <text x="70" y="470" font-size="16" fill="#aab7c6">Price moves from left to right · green = close above open · red = close below open</text>
  </g>
  <rect x="70" y="210" width="870" height="35" fill="#f2b84b" opacity="0.13"/>
  <g stroke="#f2b84b" stroke-width="3" stroke-dasharray="8 7">
    <line x1="70" y1="210" x2="940" y2="210"/>
    <line x1="70" y1="245" x2="940" y2="245"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="82" y="172" width="230" height="30" rx="6" fill="#263547"/>
    <text x="94" y="193" fill="#f2b84b">Resistance zone / old highs</text>
  </g>
  <g stroke-width="4">
    <g stroke="#38c79a" fill="#38c79a"><line x1="125" y1="350" x2="125" y2="275"/><rect x="116" y="310" width="18" height="35"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="175" y1="315" x2="175" y2="255"/><rect x="166" y="275" width="18" height="32"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="225" y1="300" x2="225" y2="220"/><rect x="216" y="250" width="18" height="40"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="275" y1="220" x2="275" y2="285"/><rect x="266" y="235" width="18" height="30"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="325" y1="295" x2="325" y2="215"/><rect x="316" y="242" width="18" height="38"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="375" y1="225" x2="375" y2="285"/><rect x="366" y="240" width="18" height="30"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="425" y1="295" x2="425" y2="212"/><rect x="416" y="238" width="18" height="34"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="475" y1="225" x2="475" y2="300"/><rect x="466" y="245" width="18" height="32"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="525" y1="255" x2="525" y2="105"/><rect x="514" y="135" width="22" height="115"/></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <path d="M525 135 L525 92 L610 92" fill="none" stroke="#38c79a" stroke-width="2"/>
    <text x="620" y="98" fill="#38c79a">Closes above the zone</text>
  </g>
  <g stroke-width="4">
    <g stroke="#ef5364" fill="#ef5364"><line x1="575" y1="135" x2="575" y2="260"/><rect x="565" y="175" width="20" height="52"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="620" y1="185" x2="620" y2="260"/><rect x="610" y="198" width="20" height="30"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="665" y1="260" x2="665" y2="145"/><rect x="655" y="175" width="20" height="48"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="715" y1="205" x2="715" y2="115"/><rect x="705" y="140" width="20" height="52"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="765" y1="130" x2="765" y2="205"/><rect x="755" y="145" width="20" height="35"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="815" y1="180" x2="815" y2="65"/><rect x="805" y="90" width="20" height="70"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="865" y1="80" x2="865" y2="145"/><rect x="855" y="95" width="20" height="30"/></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <path d="M620 260 L620 315 L720 315" fill="none" stroke="#f2b84b" stroke-width="2"/>
    <text x="690" y="321" fill="#f2b84b">Retest holds above zone</text>
    <path d="M620 260 L620 370 L735 370" fill="none" stroke="#38c79a" stroke-width="2"/>
    <text x="700" y="376" fill="#38c79a">Higher low</text>
    <path d="M815 65 L815 35 L875 35" fill="none" stroke="#38c79a" stroke-width="2"/>
    <text x="855" y="41" fill="#38c79a">Higher high</text>
  </g>
</svg>
