<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Key levels, breakout, and retest</title>
  <desc id="desc">A simple candlestick diagram showing a previous high becoming resistance, a breakout, a retest, and new higher highs and higher lows.</desc>
  <rect width="1000" height="500" fill="#17202b"/>
  <g stroke="#314052" stroke-width="1">
    <line x1="70" y1="80" x2="940" y2="80"/><line x1="70" y1="160" x2="940" y2="160"/>
    <line x1="70" y1="240" x2="940" y2="240"/><line x1="70" y1="320" x2="940" y2="320"/><line x1="70" y1="400" x2="940" y2="400"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#e8edf3">
    <text x="70" y="42" font-size="24" font-weight="700">Previous high becomes resistance, then support</text>
    <text x="70" y="470" font-size="16" fill="#aab7c6">Price moves from left to right</text>
  </g>
  <g stroke="#f2b84b" stroke-width="3" stroke-dasharray="8 7">
    <line x1="70" y1="250" x2="565" y2="250"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="82" y="218" width="188" height="28" rx="6" fill="#263547"/>
    <text x="94" y="238" fill="#f2b84b">Previous high / resistance</text>
  </g>
  <!-- candles before breakout -->
  <g stroke-width="4">
    <g stroke="#38c79a" fill="#38c79a"><line x1="120" y1="360" x2="120" y2="300"/><rect x="111" y="320" width="18" height="35"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="165" y1="315" x2="165" y2="265"/><rect x="156" y="280" width="18" height="27"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="210" y1="300" x2="210" y2="235"/><rect x="201" y="255" width="18" height="38"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="255" y1="235" x2="255" y2="285"/><rect x="246" y="245" width="18" height="28"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="300" y1="300" x2="300" y2="225"/><rect x="291" y="250" width="18" height="35"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="345" y1="232" x2="345" y2="278"/><rect x="336" y="242" width="18" height="25"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="390" y1="275" x2="390" y2="215"/><rect x="381" y="235" width="18" height="28"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="435" y1="220" x2="435" y2="275"/><rect x="426" y="235" width="18" height="26"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="480" y1="270" x2="480" y2="210"/><rect x="471" y="232" width="18" height="27"/></g>
    <!-- breakout candle -->
    <g stroke="#38c79a" fill="#38c79a"><line x1="535" y1="270" x2="535" y2="125"/><rect x="525" y="145" width="20" height="105"/></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <path d="M535 125 L535 92 L570 92" fill="none" stroke="#38c79a" stroke-width="2"/>
    <text x="578" y="98" fill="#38c79a">Breakout close</text>
  </g>
  <!-- retest and continuation -->
  <g stroke-width="4">
    <g stroke="#ef5364" fill="#ef5364"><line x1="580" y1="130" x2="580" y2="285"/><rect x="570" y="155" width="20" height="95"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="625" y1="190" x2="625" y2="275"/><rect x="615" y="205" width="20" height="45"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="670" y1="285" x2="670" y2="165"/><rect x="660" y="185" width="20" height="75"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="715" y1="205" x2="715" y2="115"/><rect x="705" y="135" width="20" height="55"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="760" y1="125" x2="760" y2="205"/><rect x="750" y="140" width="20" height="40"/></g>
    <g stroke="#38c79a" fill="#38c79a"><line x1="805" y1="180" x2="805" y2="65"/><rect x="795" y="90" width="20" height="70"/></g>
    <g stroke="#ef5364" fill="#ef5364"><line x1="850" y1="80" x2="850" y2="145"/><rect x="840" y="95" width="20" height="30"/></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <path d="M625 275 L625 330 L700 330" fill="none" stroke="#f2b84b" stroke-width="2"/>
    <text x="710" y="336" fill="#f2b84b">Retest holds as support</text>
    <path d="M670 285 L670 385 L750 385" fill="none" stroke="#38c79a" stroke-width="2"/>
    <text x="760" y="391" fill="#38c79a">Higher low</text>
    <path d="M805 65 L805 35 L860 35" fill="none" stroke="#38c79a" stroke-width="2"/>
    <text x="868" y="41" fill="#38c79a">Higher high</text>
  </g>
</svg>
