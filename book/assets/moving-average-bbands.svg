<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="20" fill="#101827"/><g font-family="Arial,sans-serif" fill="#eef2ff"><text x="40" y="48" font-size="28" font-weight="700">Moving average and Bollinger Bands</text><text x="40" y="80" font-size="17" fill="#cbd5e1">A smoothed trend line and a changing volatility envelope.</text><line x1="70" y1="420" x2="930" y2="420" stroke="#334155"/><polyline points="80,360 140,330 200,350 260,280 320,300 380,220 440,250 500,190 560,215 620,150 680,180 740,135 800,165 860,145 920,160" fill="none" stroke="#f8fafc" stroke-width="4"/><polyline points="80,350 140,340 200,330 260,315 320,300 380,275 440,255 500,230 560,215 620,195 680,180 740,170 800,165 860,160 920,158" fill="none" stroke="#fbbf24" stroke-width="5"/><polyline points="80,300 140,275 200,280 260,225 320,235 380,175 440,195 500,145 560,160 620,105 680,135 740,90 800,120 860,100 920,115" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="9 7"/><polyline points="80,400 140,395 200,380 260,365 320,365 380,330 440,315 500,300 560,290 620,275 680,260 740,250 800,245 860,235 920,235" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="9 7"/><text x="690" y="95" font-size="18" fill="#60a5fa">Upper / lower bands</text><text x="690" y="120" font-size="18" fill="#fbbf24">Moving average</text><text x="690" y="145" font-size="18" fill="#f8fafc">Price</text><text x="40" y="480" font-size="17" fill="#cbd5e1">A band touch is not automatically a reversal; it often means price is moving strongly.</text></g></svg>
